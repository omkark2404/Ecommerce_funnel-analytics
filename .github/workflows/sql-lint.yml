name: SQL Lint

on:
  push:
    paths:
      - 'sql/**.sql'
  pull_request:
    paths:
      - 'sql/**.sql'

jobs:
  sqlfluff-lint:
    name: Lint SQL files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install sqlfluff
        run: pip install sqlfluff
      - name: Run sqlfluff
        run: sqlfluff lint sql/
