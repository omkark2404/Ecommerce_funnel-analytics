name: CI

on:
  push:
    paths:
      - 'sql/**.sql'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'sql/**.sql'

jobs:
  sqlfluff-lint:
    name: Lint SQL files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install sqlfluff
        run: pip install sqlfluff
      - name: Run sqlfluff
        run: sqlfluff lint sql/

  mysql-test:
    name: Test SQL Execution
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ecommerce_analytics
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy data to MySQL container
        run: |
          docker cp data/product_users_clean.csv ${{ job.services.mysql.id }}:/var/lib/mysql-files/
          docker cp data/product_events_clean.csv ${{ job.services.mysql.id }}:/var/lib/mysql-files/

      - name: Run SQL Scripts
        run: |
          mysql -h 127.0.0.1 -u root -proot ecommerce_analytics < sql/00_schema.sql
          mysql -h 127.0.0.1 -u root -proot ecommerce_analytics < sql/01_load_data.sql
          mysql -h 127.0.0.1 -u root -proot ecommerce_analytics < sql/02_funnel_metrics.sql
          mysql -h 127.0.0.1 -u root -proot ecommerce_analytics < sql/03_time_to_convert.sql
          mysql -h 127.0.0.1 -u root -proot ecommerce_analytics < sql/04_country_segmentation.sql
