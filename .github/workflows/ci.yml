name: CI

on:
  push:
    paths:
      - '.github/workflows/ci.yml'
      - '.gitattributes'
      - '.env.example'
      - '.gitignore'
      - '.sqlfluff'
      - 'LICENSE'
      - 'Makefile'
      - 'PROJECT_HISTORY.md'
      - 'README.md'
      - 'data/**'
      - 'dashboard/**'
      - 'docker-compose.yml'
      - 'outputs/**'
      - 'requirements*.txt'
      - 'scripts/**'
      - 'sql/**'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.gitattributes'
      - '.env.example'
      - '.gitignore'
      - '.sqlfluff'
      - 'LICENSE'
      - 'Makefile'
      - 'PROJECT_HISTORY.md'
      - 'README.md'
      - 'data/**'
      - 'dashboard/**'
      - 'docker-compose.yml'
      - 'outputs/**'
      - 'requirements*.txt'
      - 'scripts/**'
      - 'sql/**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate SQL and published analysis
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ecommerce_analytics
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PWD: root
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint SQL
        run: python -m sqlfluff lint sql/
      - name: Check generated artifacts
        run: python scripts/build_artifacts.py --check
      - name: Copy CSV inputs into MySQL service
        run: |
          docker cp data/product_users_clean.csv ${{ job.services.mysql.id }}:/var/lib/mysql-files/
          docker cp data/product_events_clean.csv ${{ job.services.mysql.id }}:/var/lib/mysql-files/
      - name: Create schema and load sample data
        run: |
          mysql --host 127.0.0.1 --user root ecommerce_analytics < sql/00_schema.sql
          mysql --host 127.0.0.1 --user root ecommerce_analytics < sql/01_load_data.sql
      - name: Assert MySQL results against the sample
        run: python scripts/validate_results.py --mode host
